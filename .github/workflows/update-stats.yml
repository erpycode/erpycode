name: Update Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update all stats
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import re

          OWNER = "erpycode"
          REPOS = [
              "nahan-installer",
              "cloudflare-request-calc",
              "ip-extractor",
              "nahan",
              "Password_Generator",
              "StyleFlow-Barbershop"
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Fetch all data
          user = fetch(f"https://api.github.com/users/{OWNER}")
          all_repos = fetch(f"https://api.github.com/users/{OWNER}/repos?per_page=100")
          total_stars = sum(r["stargazers_count"] for r in all_repos)

          repo_data = {}
          for name in REPOS:
              try:
                  data = fetch(f"https://api.github.com/repos/{OWNER}/{name}")
                  repo_data[name] = {
                      "stars": data["stargazers_count"],
                      "forks": data["forks_count"]
                  }
              except:
                  pass

          # Read README
          with open("README.md", "r", encoding="utf-8") as f:
              lines = f.readlines()

          # Update each line that matches: `⭐ N` · `🍴 N`
          for i, line in enumerate(lines):
              if "⭐" in line and "🍴" in line and "`" in line:
                  # Find which repo this belongs to
                  for j in range(i, max(i-5, 0), -1):
                      for name in REPOS:
                          if name in lines[j]:
                              if name in repo_data:
                                  d = repo_data[name]
                                  # Replace the star/fork numbers precisely
                                  new_line = re.sub(r'`⭐ \d+`', f'`⭐ {d["stars"]}`', line)
                                  new_line = re.sub(r'`🍴 \d+`', f'`🍴 {d["forks"]}`', new_line)
                                  lines[i] = new_line
                                  print(f"Updated {name}: ⭐ {d['stars']} 🍴 {d['forks']}")
                              break
                      else:
                          continue
                      break

          # Update trophy badges
          content = "".join(lines)
          content = re.sub(r'⭐_Total_Stars-\d+', f'⭐_Total_Stars-{total_stars}', content)
          content = re.sub(r'📦_Repositories-\d+', f'📦_Repositories-{user["public_repos"]}', content)
          content = re.sub(r'👥_Followers-\d+', f'👥_Followers-{user["followers"]}', content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)

          print(f"\nTotal: ⭐ {total_stars}, 📦 {user['public_repos']}, 👥 {user['followers']}")
          print("All stats updated!")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update profile stats [auto]" && git push)
