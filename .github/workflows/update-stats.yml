name: Update Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update trophy badges only
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import re

          OWNER = "erpycode"

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          user = fetch_json(f"https://api.github.com/users/{OWNER}")
          repos = fetch_json(f"https://api.github.com/users/{OWNER}/repos?per_page=100")
          total_stars = sum(r["stargazers_count"] for r in repos)
          total_repos = user["public_repos"]
          followers = user["followers"]

          print(f"Stars: {total_stars}, Repos: {total_repos}, Followers: {followers}")

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # ONLY update shield.io badge values (safe - no HTML tables)
          content = re.sub(r'⭐_Total_Stars-\d+', f'⭐_Total_Stars-{total_stars}', content)
          content = re.sub(r'📦_Repositories-\d+', f'📦_Repositories-{total_repos}', content)
          content = re.sub(r'👥_Followers-\d+', f'👥_Followers-{followers}', content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)

          print("Trophy badges updated! (featured projects table untouched)")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update trophy stats [auto]" && git push)
