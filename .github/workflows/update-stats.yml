name: Update Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README stats
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          import re

          OWNER = "erpycode"
          REPOS_LIST = [
              "nahan-installer",
              "cloudflare-request-calc",
              "ip-extractor",
              "nahan",
              "Password_Generator",
              "StyleFlow-Barbershop"
          ]

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Fetch user data
          user = fetch_json(f"https://api.github.com/users/{OWNER}")
          total_stars = 0
          total_repos = user["public_repos"]

          # Fetch all repos for total stars
          repos = fetch_json(f"https://api.github.com/users/{OWNER}/repos?per_page=100")
          for r in repos:
              total_stars += r["stargazers_count"]

          followers = user["followers"]

          print(f"Stars: {total_stars}, Repos: {total_repos}, Followers: {followers}")

          # Fetch individual repo data
          repo_data = {}
          for repo in REPOS_LIST:
              try:
                  data = fetch_json(f"https://api.github.com/repos/{OWNER}/{repo}")
                  repo_data[repo] = {
                      "stars": data["stargazers_count"],
                      "forks": data["forks_count"]
                  }
                  print(f"  {repo}: ⭐ {data['stargazers_count']} 🍴 {data['forks_count']}")
              except Exception as e:
                  print(f"  {repo}: ERROR {e}")

          # Read README
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Update trophy badges
          content = re.sub(
              r'⭐_Total_Stars-\d+',
              f'⭐_Total_Stars-{total_stars}',
              content
          )
          content = re.sub(
              r'📦_Repositories-\d+',
              f'📦_Repositories-{total_repos}',
              content
          )
          content = re.sub(
              r'👥_Followers-\d+',
              f'👥_Followers-{followers}',
              content
          )

          # Update featured projects - using the line pattern
          for repo, data in repo_data.items():
              # Match the pattern: `⭐ N` · `🍴 N` after the repo description
              pattern = rf'(`⭐ \d+` · `🍴 \d+` · `[^\`]+`)'
              # Find the section for this repo and update
              # Simple approach: find line with stars after repo name
              lines = content.split('\n')
              in_repo = False
              for i, line in enumerate(lines):
                  if repo in line and '###' in line:
                      in_repo = True
                  if in_repo and '⭐' in line and '🍴' in line:
                      lines[i] = f'`⭐ {data["stars"]}` · `🍴 {data["forks"]}` · `{line.split("·")[-1].strip("` ")}'
                      in_repo = False
                      break
              content = '\n'.join(lines)

          # Write README
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)

          print("README updated successfully!")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update profile stats [auto]" && git push)
